name: Probe darich sku

on:
  workflow_dispatch:

concurrency:
  group: probe-darich-sku
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: python probe_sku.py
