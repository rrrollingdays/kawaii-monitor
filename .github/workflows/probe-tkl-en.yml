name: Probe TKL EN

on:
  workflow_dispatch:

concurrency:
  group: probe-tkl-en
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install curl-cffi
        run: pip install curl-cffi
      - name: Probe
        run: python probe_tkl_en.py
