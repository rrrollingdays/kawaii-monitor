name: Olive Monitor Sold Out
on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:

concurrency:
  group: olive-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install curl-cffi
        run: pip install curl-cffi
      - name: Run olive monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          STATE_FILE: olive_state.json
          OLIVE_STOCK_UPDATES_CSV: olive-stock-updates.csv
          OLIVE_BRAND_CHANGES_CSV: olive-brand-changes.csv
        run: python olive_monitor.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add olive_state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "update olive state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Retry $i after conflict..."
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1

      - name: Upload pending inventory updates
        if: ${{ hashFiles('olive-stock-updates.csv') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: olive-stock-updates-${{ github.run_attempt }}
          path: olive-stock-updates.csv
          if-no-files-found: error

      - name: Upload OLIVE brand stock changes
        if: ${{ hashFiles('olive-brand-changes.csv') != '' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: olive-brand-changes-${{ github.run_attempt }}
          path: olive-brand-changes.csv
          if-no-files-found: error
