name: LIZ Global Monitor Sold Out

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: liz-global-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install curl-cffi
        run: pip install curl-cffi
      - name: Run LIZ global monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          STATE_FILE: liz_global_state.json
        run: python liz_global_monitor.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add liz_global_state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "update liz global state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Retry $i after conflict..."
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1
