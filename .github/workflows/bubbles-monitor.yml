name: Bubbles Monitor Sold Out
on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

concurrency:
  group: bubbles-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bubbles monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          STATE_FILE: bubbles_state.json
        run: python bubbles_monitor.py --once

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bubbles_state.json || true
          git diff --staged --quiet && exit 0
          git commit -m "update bubbles state"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Retry $i after conflict..."
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1
