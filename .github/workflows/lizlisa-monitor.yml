name: LIZLISA Monitor Sold Out

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          STATE_FILE: lizlisa_state.json
        run: python lizlisa_monitor.py --once

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lizlisa_state.json || true
          git diff --staged --quiet || git commit -m "update lizlisa state"
          git push || true
